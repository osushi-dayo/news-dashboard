name: daily-news-dashboard

on:
  schedule:
    - cron: "0 20 * * *"   # UTC 20:00 = 日本時間 毎朝 5:00(混雑時は数分〜数十分遅れることあり)
  workflow_dispatch:         # 手動実行ボタン用
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build dashboard
        run: python3 build.py
      - name: Save archive (also keeps the repo active so the schedule is never auto-disabled)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git diff --cached --quiet || git commit -m "archive $(TZ=Asia/Tokyo date +%F)"
          git push || true
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
